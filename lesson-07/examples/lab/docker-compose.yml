services:
  database:
    build:
      context: ./vendor/openhospital-api/deps/openhospital-core
      dockerfile: Dockerfile-ohdb
      args:
        OH_DB_LANG: ${OH_DB_LANG}
    image: lesson07-oh-core-database:latest
    command: mysqld --sql_mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION" --lower_case_table_names=1 --explicit_defaults_for_timestamp=OFF
    environment:
      MARIADB_DATABASE: ${OH_MARIADB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${OH_MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${OH_MARIADB_USER}
      MARIADB_PASSWORD: ${OH_MARIADB_PASSWORD}
    networks:
      db_net:
        ipv4_address: 10.40.0.10

  oh-database-init:
    image: lesson07-oh-core-database:latest
    command: >
      sh -c "mysql -v --host database -u ${OH_MARIADB_USER} -p${OH_MARIADB_PASSWORD} ${OH_MARIADB_DATABASE} < /database-sources/delete_all_data.sql &&
      sed '1{/^\\/\\*M!999999/d;}' /database-sources/load_demo_data.sql | mysql -v --host database -u ${OH_MARIADB_USER} -p${OH_MARIADB_PASSWORD} ${OH_MARIADB_DATABASE}"
    depends_on:
      - database
    working_dir: /database-sources
    environment:
      MARIADB_MYSQL_LOCALHOST_USER: "true"
      MARIADB_DATABASE: ${OH_MARIADB_DATABASE}
      MARIADB_ROOT_PASSWORD: ${OH_MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${OH_MARIADB_USER}
      MARIADB_PASSWORD: ${OH_MARIADB_PASSWORD}
    volumes:
      - ./vendor/openhospital-api/deps/openhospital-core/sql:/database-sources:ro
    networks:
      db_net:

  backend:
    container_name: oh-api
    build:
      context: ./vendor/openhospital-api
      dockerfile: Dockerfile.backend
      args:
        OH_CORE_BRANCH: ${OH_CORE_BRANCH}
        OH_API_BRANCH: ${OH_API_BRANCH}
        GITHUB_ORG: ${GITHUB_ORG}
    depends_on:
      - database
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:mariadb://database:3306/${OH_MARIADB_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${OH_MARIADB_USER}
      SPRING_DATASOURCE_PASSWORD: ${OH_MARIADB_PASSWORD}
    networks:
      server_net:
        ipv4_address: 10.30.0.30
      db_net:
        ipv4_address: 10.40.0.30

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: oh-proxy
    depends_on:
      - backend
    networks:
      dmz_net:
        ipv4_address: 172.16.10.10
      server_net:
        ipv4_address: 10.30.0.20
      clinical_net:
        ipv4_address: 10.20.0.10
      lab_net:
        ipv4_address: 10.50.0.10
      guest_net:
        ipv4_address: 10.60.0.10
      vpn_net:
        ipv4_address: 10.70.0.10
    ports:
      - "8088:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  clinical-client:
    image: curlimages/curl:8.11.1
    container_name: oh-clinical-client
    command: sleep infinity
    networks:
      clinical_net:
        ipv4_address: 10.20.0.50

  lab-client:
    image: curlimages/curl:8.11.1
    container_name: oh-lab-client
    command: sleep infinity
    networks:
      lab_net:
        ipv4_address: 10.50.0.50

  guest-client:
    image: curlimages/curl:8.11.1
    container_name: oh-guest-client
    command: sleep infinity
    networks:
      guest_net:
        ipv4_address: 10.60.0.50

  vpn-client:
    image: curlimages/curl:8.11.1
    container_name: oh-vpn-client
    command: sleep infinity
    networks:
      vpn_net:
        ipv4_address: 10.70.0.50

  dmz-client:
    image: curlimages/curl:8.11.1
    container_name: oh-dmz-client
    command: sleep infinity
    networks:
      dmz_net:
        ipv4_address: 172.16.10.50

networks:
  clinical_net:
    ipam:
      config:
        - subnet: 10.20.0.0/24
  lab_net:
    ipam:
      config:
        - subnet: 10.50.0.0/24
  guest_net:
    ipam:
      config:
        - subnet: 10.60.0.0/24
  vpn_net:
    ipam:
      config:
        - subnet: 10.70.0.0/24
  dmz_net:
    ipam:
      config:
        - subnet: 172.16.10.0/24
  server_net:
    ipam:
      config:
        - subnet: 10.30.0.0/24
  db_net:
    ipam:
      config:
        - subnet: 10.40.0.0/24
