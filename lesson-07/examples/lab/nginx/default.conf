log_format hospital '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log hospital;

    # Milestone 1 starter policy:
    # everything is allowed so the deployment can be tested first.
    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
