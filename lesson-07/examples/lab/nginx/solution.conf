log_format hospital '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log hospital;

    # Public operational health check for the lab.
    location = /healthcheck {
        allow 10.20.0.0/24;
        allow 10.50.0.0/24;
        allow 10.70.0.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    # Authentication must be reachable by approved operational networks.
    location = /auth/login {
        allow 10.20.0.0/24;
        allow 10.50.0.0/24;
        allow 10.70.0.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    # Laboratory network can use laboratory API areas.
    location ^~ /laboratories {
        allow 10.20.0.0/24;
        allow 10.50.0.0/24;
        allow 10.70.0.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    location ^~ /exams {
        allow 10.20.0.0/24;
        allow 10.50.0.0/24;
        allow 10.70.0.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    location ^~ /examtypes {
        allow 10.20.0.0/24;
        allow 10.50.0.0/24;
        allow 10.70.0.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    location ^~ /examrows {
        allow 10.20.0.0/24;
        allow 10.50.0.0/24;
        allow 10.70.0.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    # Clinical and VPN networks can use patient and admission APIs.
    location ^~ /patients {
        allow 10.20.0.0/24;
        allow 10.70.0.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    location ^~ /admissions {
        allow 10.20.0.0/24;
        allow 10.70.0.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    # Admission-type CRUD is used as a low-risk administrative API exercise.
    location ^~ /admissiontypes {
        allow 10.20.0.0/24;
        allow 10.70.0.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    # Swagger and OpenAPI metadata expose the shape of the system.
    # In this lab they are limited to the DMZ/admin documentation network.
    location ^~ /swagger-ui {
        allow 172.16.10.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    location ^~ /v3/api-docs {
        allow 172.16.10.0/24;
        deny all;
        proxy_pass http://backend:8080;
    }

    # Everything else is denied until a clinical reason exists.
    location / {
        deny all;
    }
}
